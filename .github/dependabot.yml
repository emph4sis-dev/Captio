version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      tests:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "coverlet*"]

  # Updates the pinned action SHAs (and their version comments) in the workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
